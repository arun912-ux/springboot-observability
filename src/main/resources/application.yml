spring:



# redis
  data:
    redis:
      host: redis://enabling-molly-40932.upstash.io:6379
      port: 24981
      password: ${REDIS_PASSWORD}
      username: default
      client-type: Lettuce
      database: 0
      ssl:
        enabled: true



  # postgres
  datasource:
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
    url: jdbc:postgresql://ep-little-darkness-ao35vpop-pooler.c-2.ap-southeast-1.aws.neon.tech/neondb
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate      # for development, use 'validate' or 'none' for production
    show-sql: true           # optional: shows SQL in logs
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate.format_sql: true



#  cache:
#    type: caffeine





  rabbitmq:
    host: coral-01.rmq3.cloudamqp.com
    port: 5672
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}

    # Optional: connection settings
    virtual-host: /
    connection-timeout: 60000

    # Publisher confirms & returns (useful for reliability)
    publisher-confirm-type: correlated
    publisher-returns: true

    # Listener container config
    listener:
      simple:
        acknowledge-mode: auto
        concurrency: 3
        max-concurrency: 10
      direct:
        acknowledge-mode: manual




weather:
  apikey: ${OPEN_WEATHER_API_KEY:0c3c357cbb2ceacfc2544131a21c4cdd}


