plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.8'
    id 'io.spring.dependency-management' version '1.1.7'
}
ext {
    springCloudVersion = "2025.1.0"
}

group = 'org.example'
version = '0.0.1-SNAPSHOT'
description = 'spring-observability'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

jar.enabled = false
bootJar {
    archiveBaseName = "${project.name}"
    archiveVersion = "${project.version}"
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
    maven {
        url = "https://akeyless.jfrog.io/artifactory/akeyless-java"
    }
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:$springCloudVersion"
    }
}


dependencies {

    // web
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-webclient'
    implementation 'org.springframework.boot:spring-boot-starter-restclient'

    // db and cache
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-cache'

    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

    implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-reactor-resilience4j'

    runtimeOnly 'org.postgresql:postgresql'
    implementation 'com.github.ben-manes.caffeine:caffeine:3.2.4'

    // spring-cloud for deferredLog
    implementation 'org.springframework.cloud:spring-cloud-dependencies:2025.1.3'

    // actuator and OTEL
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-opentelemetry'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    implementation 'net.ttddyy.observation:datasource-micrometer-spring-boot:2.2.1'
    implementation 'io.opentelemetry.instrumentation:opentelemetry-logback-appender-1.0:2.26.0-alpha'

    // swagger
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'

    // rabbit-mq
    implementation 'org.springframework.boot:spring-boot-starter-amqp'

    // hashicorp-vault
    implementation 'org.springframework.cloud:spring-cloud-starter-vault-config'
    // infiscal
    implementation 'com.infisical:sdk:3.0.8'

    compileOnly 'org.projectlombok:lombok'

    annotationProcessor 'org.projectlombok:lombok'
    implementation 'org.springframework.boot:spring-boot-starter-jackson'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'io.projectreactor:reactor-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.springframework.boot:spring-boot-starter-amqp-test'

    // testcontainers
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-vault'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
//    testImplementation 'org.testcontainers:testcontainers-kafka'


}

tasks.named('test') {
    useJUnitPlatform()
//    excludes ["org.example.observability.controller.WebControllerTest*"]
}

// integration tests
sourceSets {
    integrationTest {
        java {
            srcDir('src/integrationTest/java')
        }
        resources {
            srcDir('src/integrationTest/resources')
        }
        compileClasspath += main.output + test.output
        runtimeClasspath += main.output + test.output
    }
}

// Share dependencies from main and test configurations
configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

tasks.register('integrationTest', Test) {
    description = 'Runs integration tests.'
    group = 'verification'

    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath

    testLogging {
        events 'failed'
    }

    useJUnitPlatform()
    shouldRunAfter test
}

check.dependsOn integrationTest
